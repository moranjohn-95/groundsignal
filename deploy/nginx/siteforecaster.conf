server {
    listen 80;
    server_name siteforecaster.com www.siteforecaster.com;

    access_log /var/log/nginx/siteforecaster-access.log siteforecaster_safe;

    # Keep the original destination for the redirect; the access log records only $uri.
    return 301 https://siteforecaster.com$request_uri;
}

server {
    listen 443 ssl;
    server_name siteforecaster.com www.siteforecaster.com;

    access_log /var/log/nginx/siteforecaster-access.log siteforecaster_safe;

    ssl_certificate /etc/nginx/ssl/siteforecaster/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/siteforecaster/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    root /var/www/siteforecaster;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

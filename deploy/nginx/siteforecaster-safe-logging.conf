# Include this file from Nginx's http block before the SiteForecaster server
# configuration (for example, via /etc/nginx/conf.d/).
# Use the path only so location searches and coordinates are not kept in access logs.
log_format siteforecaster_safe '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent '
                              '"$http_user_agent"';
